<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #edf1f5; --surface: #ffffff; --ink: #16202a; --muted: #5b6b7a;
    --line: #e1e7ed; --hover: #f3f7fa; --accent: #0f766e; --accent-soft: #e0f2f0;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1318; --surface: #151d25; --ink: #e8eef3; --muted: #90a1b1;
            --line: #24303b; --hover: #1b252f; --accent: #4fd1c5; --accent-soft: #14302f; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px 64px; }
  header { margin-bottom: 24px; }
  h1 { margin: 0; font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; word-break: break-word; }

  .search {
    width: 100%; margin-bottom: 20px; padding: 12px 16px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Category = a directory that contains other directories */
  .cat { margin-top: 28px; }
  .cat .cat { margin-left: 14px; padding-left: 16px; border-left: 2px solid var(--line); }
  .cat-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
  .cat-head .ico { flex: none; width: 32px; height: 32px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: 10px; }
  .cat-head svg { width: 18px; height: 18px; }
  .cat-head .count { margin-left: auto; font-size: .8rem; font-weight: 500; color: var(--muted); }
  .cat-head .name { overflow-wrap: anywhere; }

  /* Card = a directory with no directories inside */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .card {
    display: flex; flex-direction: column; gap: 12px; padding: 16px; color: inherit; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--hover); }
  .card .ico { width: 40px; height: 40px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border-radius: 12px; }
  .card svg { width: 22px; height: 22px; }
  .card .name { font-weight: 700; overflow-wrap: anywhere; }

  .state { padding: 48px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .state strong { display: block; color: var(--ink); margin-bottom: 4px; }
  .state code { background: var(--hover); padding: 2px 6px; border-radius: 6px; font-size: .85em; }
  .spinner { width: 22px; height: 22px; margin: 0 auto 10px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .card { transition: none; } .card:hover { transform: none; } }

  @media (max-width: 480px) {
    main { padding-top: 32px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .cat .cat { margin-left: 4px; padding-left: 10px; }
  }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Home</h1></header>
  <input class="search" id="search" type="search" placeholder="Filter" aria-label="Filter" hidden>
  <div id="root"></div>
</main>

<script>
/* ---------- Optional settings ----------
   Leave blank on a github.io site: owner and repo are detected automatically.
   Fill in owner + repo when using a custom domain. */
const CONFIG = {
  owner: '',          // e.g. 'octocat'
  repo: '',           // e.g. 'my-files'
  branch: '',         // blank = the repo's default branch
  baseDir: '',        // folder this page lives in, relative to the repo root ('' = root)
  hideDotfiles: true, // hide folders that start with "."
  title: ''           // blank = repo name
};

const $ = id => document.getElementById(id);
const here = location.pathname.replace(/[^/]*$/, '');
const segs = here.split('/').filter(Boolean).map(decodeURIComponent);

const ICONS = {
  // card: a leaf directory
  card: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.4c.6 0 1.2.3 1.6.8L12 7.5h6.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>',
  // category: a directory that holds other directories
  cat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5"/></svg>'
};

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = arr => arr.map(encodeURIComponent).join('/');
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });

function candidates() {
  if (CONFIG.owner && CONFIG.repo) return [{ owner: CONFIG.owner, repo: CONFIG.repo, base: CONFIG.baseDir }];
  if (!location.hostname.endsWith('.github.io')) return [];
  const owner = location.hostname.split('.')[0];
  const list = [];
  if (segs.length) list.push({ owner, repo: segs[0], base: segs.slice(1).join('/') });   // project site
  list.push({ owner, repo: owner + '.github.io', base: segs.join('/') });                 // user site
  return list;
}

/* One request returns every folder in the repo */
async function fetchTree(c) {
  const ref = CONFIG.branch ? encodeURIComponent(CONFIG.branch) : 'HEAD';
  const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/git/trees/${ref}?recursive=1`,
                          { headers: { Accept: 'application/vnd.github+json' } });
  if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
  return (await res.json()).tree;
}

/* Build a nested folder tree: { name, path:[...], kids: Map } */
function buildTree(entries, base) {
  const root = { name: '', path: [], kids: new Map() };
  const prefix = base ? base.replace(/^\/|\/$/g, '') + '/' : '';
  for (const e of entries) {
    if (e.type !== 'tree' || !e.path.startsWith(prefix)) continue;
    const parts = e.path.slice(prefix.length).split('/').filter(Boolean);
    if (!parts.length) continue;
    if (CONFIG.hideDotfiles && parts.some(p => p.startsWith('.'))) continue;
    let node = root;
    parts.forEach((p, i) => {
      if (!node.kids.has(p)) node.kids.set(p, { name: p, path: parts.slice(0, i + 1), kids: new Map() });
      node = node.kids.get(p);
    });
  }
  return root;
}

function countLeaves(n) {
  if (!n.kids.size) return 1;
  let t = 0; n.kids.forEach(k => t += countLeaves(k));
  return t;
}

function renderNode(node) {
  const kids = [...node.kids.values()].sort(byName);
  const leaves = kids.filter(k => !k.kids.size);
  const cats = kids.filter(k => k.kids.size);
  let html = '';
  if (leaves.length) {
    html += '<div class="grid">' + leaves.map(l =>
      `<a class="card" data-n="${esc(l.name.toLowerCase())}" href="${here}${enc(l.path)}/">` +
      `<span class="ico">${ICONS.card}</span><span class="name">${esc(l.name)}</span></a>`).join('') + '</div>';
  }
  for (const c of cats) {
    html += `<section class="cat"><h2 class="cat-head"><span class="ico">${ICONS.cat}</span>` +
            `<span class="name">${esc(c.name)}</span><span class="count">${countLeaves(c)}</span></h2>` +
            renderNode(c) + '</section>';
  }
  return html;
}

function setState(html) { $('root').innerHTML = `<div class="state">${html}</div>`; $('search').hidden = true; }

async function render() {
  setState('<div class="spinner"></div>Loading…');
  const cands = candidates();
  if (!cands.length) return setState('<strong>Repository not detected</strong>Set <code>owner</code> and <code>repo</code> in the CONFIG block at the top of the script.');
  let tree, ctx, last;
  for (const c of cands) {
    try {
      const entries = await fetchTree(c);
      const t = buildTree(entries, c.base);
      // keep the first candidate that works; prefer one that actually has folders
      if (!ctx || (!ctx.t.kids.size && t.kids.size)) { ctx = { c, t }; }
      if (t.kids.size) break;
    } catch (e) { last = e; }
  }
  if (!ctx) {
    if (last && last.status === 403) return setState('<strong>GitHub rate limit reached</strong>Unauthenticated requests are limited per hour. Try again later.');
    if (last && last.status === 404) return setState('<strong>Repository not found</strong>Check the CONFIG values.');
    return setState('<strong>Could not load folders</strong>Check your connection and reload the page.');
  }
  tree = ctx.t;
  const name = CONFIG.title || ctx.c.repo;
  $('title').textContent = name; document.title = name;
  if (!tree.kids.size) return setState('<strong>No folders yet</strong>Add folders to the repository and they will appear here.');
  $('root').innerHTML = renderNode(tree);
  $('search').hidden = document.querySelectorAll('.card').length < 8;
}

$('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(c => { c.hidden = !!q && !c.dataset.n.includes(q); });
  // hide categories with no visible cards (deepest first)
  [...document.querySelectorAll('section.cat')].reverse().forEach(s => {
    s.hidden = !!q && !s.querySelector('.card:not([hidden])');
  });
});

render();
</script>
</body>
</html>
