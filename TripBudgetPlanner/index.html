<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Budget Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e0;--card:#fffdf8;--ink:#3b2a20;--muted:#8a7263;--line:#f0dcc0;--c1:#ff7a59;--c2:#2bb5a0;--c3:#ffb830;--c4:#7c6cf0;--c5:#ec5f9a;--bad:#d8402f;--good:#1f9a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f1a;--card:#3a2c25;--ink:#fff0dc;--muted:#c4a992;--line:#54423a;--bad:#ff7d6b;--good:#5fd6a5}}
:root[data-theme="dark"]{--bg:#2a1f1a;--card:#3a2c25;--ink:#fff0dc;--muted:#c4a992;--line:#54423a;--bad:#ff7d6b;--good:#5fd6a5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;line-height:1.4}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:.2em 0 0}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line)}
.card h2{font-size:1.15rem;margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.row label{flex:1}
.row small{display:block;color:var(--muted);font-size:.78rem}
input[type=number],select{width:104px;font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:3px solid var(--c3)}
input[type=range]{width:100%;accent-color:var(--c1)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--c3);color:#3b2a20;font:inherit;font-size:1.1rem;cursor:pointer}
.stepper button:active{transform:scale(.92)}
.stepper b{min-width:26px;text-align:center}
.big{font-size:2.3rem;font-weight:600;margin:0}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:500;background:var(--line)}
.ok{color:var(--good)}.over{color:var(--bad)}
.meter{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stats div{background:var(--bg);border-radius:14px;padding:8px 12px}
.stats span{display:block;color:var(--muted);font-size:.78rem}
.bars .b{margin:10px 0}
.bars .top{display:flex;justify-content:space-between;font-size:.92rem}
.bars .track{height:20px;background:var(--line);border-radius:10px;overflow:hidden}
.bars .fill{height:100%;border-radius:10px;transition:width .3s}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:360px}
th,td{text-align:left;padding:9px 6px;border-bottom:2px dashed var(--line)}
th{color:var(--muted);font-weight:500;font-size:.85rem}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
tfoot td{font-weight:600;border:0}
.full{grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧳 Trip Budget Planner</h1>
  <p class="sub">Slide, tap and tweak. Watch your adventure fund update live.</p>

  <div class="grid">
    <div class="card">
      <h2>🗺️ The trip</h2>
      <div class="row"><label>Currency</label>
        <select id="cur"><option>$</option><option>€</option><option>£</option><option>₹</option><option>¥</option></select></div>
      <div class="row"><label>Days</label><div class="stepper"><button data-s="days" data-d="-1">−</button><b id="daysV">7</b><button data-s="days" data-d="1">+</button></div></div>
      <div class="row"><label>Travelers</label><div class="stepper"><button data-s="pax" data-d="-1">−</button><b id="paxV">2</b><button data-s="pax" data-d="1">+</button></div></div>
      <div class="row"><label>Total budget</label><input type="number" id="budget" value="3000" min="0" step="100"></div>
      <div class="row"><label>Safety buffer <b id="bufV">10%</b><small>Extra cushion for surprises</small></label></div>
      <input type="range" id="buf" min="0" max="30" value="10">
    </div>

    <div class="card">
      <h2>💸 Costs</h2>
      <div class="row"><label>✈️ Flights<small>per person</small></label><input type="number" id="flights" value="450" min="0" step="10"></div>
      <div class="row"><label>🏨 Stay<small>per night, total</small></label><input type="number" id="stay" value="110" min="0" step="5"></div>
      <div class="row"><label>🍜 Food<small>per person, per day</small></label><input type="number" id="food" value="40" min="0" step="5"></div>
      <div class="row"><label>🎟️ Activities<small>per person, whole trip</small></label><input type="number" id="act" value="150" min="0" step="10"></div>
      <div class="row"><label>🚌 Local transport<small>per day, total</small></label><input type="number" id="trans" value="20" min="0" step="5"></div>
    </div>

    <div class="card full">
      <h2>🎯 The verdict</h2>
      <p class="big" id="total"></p>
      <span class="pill" id="verdict"></span>
      <div class="meter"><i id="meter"></i></div>
      <div class="stats">
        <div><span>Per person</span><b id="pp"></b></div>
        <div><span>Per day</span><b id="pd"></b></div>
      </div>
    </div>

    <div class="card">
      <h2>📊 Where it goes</h2>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card">
      <h2>🧾 Breakdown</h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Category</th><th>Amount</th><th>Share</th></tr></thead>
          <tbody id="rows"></tbody>
          <tfoot id="foot"></tfoot>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var S={days:7,pax:2};
var $=function(i){return document.getElementById(i)};
var cats=[
 {k:'flights',n:'✈️ Flights',c:'var(--c1)'},
 {k:'stay',n:'🏨 Stay',c:'var(--c2)'},
 {k:'food',n:'🍜 Food',c:'var(--c3)'},
 {k:'act',n:'🎟️ Activities',c:'var(--c4)'},
 {k:'trans',n:'🚌 Transport',c:'var(--c5)'},
 {k:'buf',n:'🛟 Buffer',c:'#a08a7a'}
];
function num(id){var v=parseFloat($(id).value);return isNaN(v)||v<0?0:v}
function fmt(n){return $('cur').value+Math.round(n).toLocaleString()}
function calc(){
  var d=S.days,p=S.pax,nights=Math.max(d-1,1);
  var v={flights:num('flights')*p,stay:num('stay')*nights,food:num('food')*p*d,act:num('act')*p,trans:num('trans')*d};
  var sub=v.flights+v.stay+v.food+v.act+v.trans;
  v.buf=sub*num('buf')/100;
  var total=sub+v.buf,budget=num('budget');
  $('daysV').textContent=d;$('paxV').textContent=p;$('bufV').textContent=$('buf').value+'%';
  $('total').textContent=fmt(total);
  var diff=budget-total,vd=$('verdict');
  if(budget===0){vd.textContent='Set a budget to compare';vd.className='pill'}
  else if(diff>=0){vd.textContent='🎉 '+fmt(diff)+' to spare';vd.className='pill ok'}
  else{vd.textContent='😬 '+fmt(-diff)+' over budget';vd.className='pill over'}
  var pct=budget?Math.min(total/budget*100,100):0,m=$('meter');
  m.style.width=pct+'%';m.style.background=total>budget&&budget?'var(--bad)':'var(--good)';
  $('pp').textContent=fmt(total/p);$('pd').textContent=fmt(total/d);
  var mx=Math.max.apply(null,cats.map(function(c){return v[c.k]}))||1;
  $('bars').innerHTML=cats.map(function(c){
    return '<div class="b"><div class="top"><span>'+c.n+'</span><b>'+fmt(v[c.k])+'</b></div><div class="track"><div class="fill" style="width:'+(v[c.k]/mx*100)+'%;background:'+c.c+'"></div></div></div>'}).join('');
  $('rows').innerHTML=cats.map(function(c){
    return '<tr><td>'+c.n+'</td><td>'+fmt(v[c.k])+'</td><td>'+(total?Math.round(v[c.k]/total*100):0)+'%</td></tr>'}).join('');
  $('foot').innerHTML='<tr><td>Total</td><td>'+fmt(total)+'</td><td>100%</td></tr>';
}
document.querySelectorAll('.stepper button').forEach(function(b){
  b.onclick=function(){var s=b.dataset.s,n=S[s]+parseInt(b.dataset.d,10);S[s]=Math.min(Math.max(n,1),s==='days'?60:20);calc()}});
document.querySelectorAll('input,select').forEach(function(e){e.oninput=calc;e.onchange=calc});
calc();
</script>
</body>
</html>
